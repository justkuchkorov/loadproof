<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Hand</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f1720; color: #e6edf3; font: 14px system-ui, sans-serif; overflow: hidden; }
    #view { position: fixed; inset: 0; }
    #status { position: fixed; top: 12px; left: 12px; padding: 6px 10px; background: #0008; border-radius: 6px; }
    #start { position: fixed; top: 12px; right: 12px; padding: 8px 14px; font: inherit; border: 0; border-radius: 6px; background: #238636; color: #fff; cursor: pointer; }
    #start:disabled { opacity: 0.6; cursor: default; }
    #camwrap { display: none; position: fixed; right: 12px; bottom: 12px; width: 320px; height: 240px; border-radius: 8px; overflow: hidden; border: 1px solid #30363d; transform: scaleX(-1); }
    #camwrap video, #camwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #agent { position: fixed; left: 12px; bottom: 12px; width: min(420px, calc(100vw - 24px)); background: #0d1117e6; border: 1px solid #30363d; border-radius: 8px; padding: 10px; box-sizing: border-box; }
    #agent .row { display: flex; gap: 6px; }
    #ask { flex: 1; min-width: 0; padding: 8px 10px; font: inherit; color: inherit; background: #161b22; border: 1px solid #30363d; border-radius: 6px; }
    #agent button { padding: 8px 12px; font: inherit; border: 0; border-radius: 6px; color: #fff; cursor: pointer; }
    #build { background: #1f6feb; }
    #build:disabled { opacity: 0.6; cursor: default; }
    #stop { background: #30363d; }
    #truck { background: #9e6a03; flex: 1; }
    #banner { display: none; position: fixed; top: 64px; left: 50%; transform: translateX(-50%); padding: 10px 22px; background: #9e6a03; color: #fff; font-size: 22px; font-weight: 700; border-radius: 8px; letter-spacing: 0.5px; box-shadow: 0 4px 20px #0008; }
    #log { list-style: none; margin: 8px 0 0; padding: 0; max-height: 34vh; overflow-y: auto; font-size: 13px; line-height: 1.45; }
    #log:empty { display: none; }
    #log li { padding: 2px 0 2px 18px; position: relative; }
    #log li::before { position: absolute; left: 0; }
    #log .you { color: #e6edf3; font-weight: 600; }
    #log .step::before { content: '›'; color: #8b949e; }
    #log .info { color: #8b949e; }
    #log .ok::before { content: '✓'; color: #3fb950; }
    #log .fail { color: #ffa198; }
    #log .fail::before { content: '✗'; color: #f85149; }
    #log .done { color: #3fb950; font-weight: 600; }
    #log .done::before { content: '★'; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="status">Loading MuJoCo…</div>
  <button id="start">Start camera</button>
  <div id="banner"></div>
  <div id="agent">
    <div class="row">
      <input id="ask" placeholder="What should I build? e.g. a bridge" autocomplete="off">
      <button id="build">Build</button>
      <button id="stop">Stop</button>
    </div>
    <div class="row" style="margin-top: 6px">
      <button id="truck" title="Push the load at 0.5 g, like a truck braking or swerving (after the EU test EUMOS 40509)">🚚 Truck test (0.5 g)</button>
    </div>
    <ul id="log"></ul>
  </div>
  <div id="camwrap">
    <video id="cam" playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
