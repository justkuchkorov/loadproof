<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoadProof</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f1720; color: #e6edf3; font: 14px system-ui, sans-serif; overflow: hidden; }
    #view { position: fixed; inset: 0; }
    #eye { position: fixed; z-index: 5; right: 12px; bottom: 12px; background: #0d1117e6; border: 1px solid #30363d; border-radius: 8px; padding: 6px 8px 8px; font-size: 11px; }
    #eye canvas { display: block; width: 214px; height: 174px; image-rendering: pixelated; margin-top: 4px; border-radius: 4px; }
    #status { position: fixed; top: 12px; left: 12px; padding: 6px 10px; background: #0008; border-radius: 6px; }
    #start { position: fixed; top: 12px; right: 12px; padding: 8px 14px; font: inherit; border: 0; border-radius: 6px; background: #238636; color: #fff; cursor: pointer; }
    #start:disabled { opacity: 0.6; cursor: default; }
    #rec { position: fixed; top: 12px; right: 150px; padding: 8px 14px; font: inherit; border: 0; border-radius: 6px; background: #30363d; color: #fff; cursor: pointer; }
    #rec.on { background: #da3633; }
    #camwrap { display: none; position: fixed; right: 12px; bottom: 236px; width: 320px; height: 240px; border-radius: 8px; overflow: hidden; border: 1px solid #30363d; transform: scaleX(-1); }
    #camwrap video, #camwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #agent { position: fixed; left: 12px; bottom: 12px; width: min(470px, calc(100vw - 24px)); background: #0d1117e6; border: 1px solid #30363d; border-radius: 8px; padding: 10px; box-sizing: border-box; }
    #agent .row { display: flex; gap: 6px; }
    #ask { flex: 1; min-width: 0; padding: 8px 10px; font: inherit; color: inherit; background: #161b22; border: 1px solid #30363d; border-radius: 6px; }
    #agent button { padding: 8px 12px; font: inherit; border: 0; border-radius: 6px; color: #fff; cursor: pointer; }
    #build { background: #1f6feb; }
    #build:disabled { opacity: 0.6; cursor: default; }
    #stop { background: #30363d; }
    #truck { background: #9e6a03; flex: 0 0 auto; white-space: nowrap; }
    #compare { background: #6639ba; flex: 1; }
    #knock { background: #8e1519; flex: 1; }
    #wrap { background: #1b4b5a; flex: 0.8; }
    #report { background: #30363d; flex: 0.8; }
    .slider { margin-top: 6px; align-items: center; gap: 8px; font-size: 12px; }
    .slider input { flex: 1; accent-color: #9e6a03; }
    #gnote { white-space: nowrap; min-width: 150px; font-size: 11px; }
    #worker { background: #6e4a1f; flex: 1; }
    #build { flex: 1.4; }
    #agent .head { margin-bottom: 4px; }
    #agent .dim { color: #8b949e; font-size: 12px; }
    #order { list-style: none; margin: 0 0 8px; padding: 0; columns: 2; font-size: 12px; line-height: 1.5; }
    #order .fragile { color: #ffa198; font-weight: 700; font-size: 10px; }
    #editor { display: none; border-top: 1px solid #30363d; padding-top: 6px; margin-bottom: 6px; }
    #editor.open { display: block; }
    #agent .chip { padding: 2px 7px; margin: 2px; font-size: 12px; border-radius: 10px; background: #30363d; }
    #agent .chip.add { background: #1f3a5f; }
    #agent .link { background: none; padding: 0 4px; color: #58a6ff; font-size: 12px; text-decoration: underline; }
    #random, #demo, #load { flex: 1; background: #30363d; }
    #load { background: #1f6feb; }
    .toggle { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    #memory { margin-top: 6px; font-size: 12px; }
    #memory summary { cursor: pointer; color: #d2a8ff; }
    #lessons { margin: 4px 0; padding-left: 18px; }
    #banner { display: none; position: fixed; top: 64px; left: 50%; transform: translateX(-50%); padding: 10px 22px; background: #9e6a03; color: #fff; font-size: 22px; font-weight: 700; border-radius: 8px; letter-spacing: 0.5px; box-shadow: 0 4px 20px #0008; }
    #log { list-style: none; margin: 8px 0 0; padding: 0; max-height: 34vh; overflow-y: auto; font-size: 13px; line-height: 1.45; }
    #log:empty { display: none; }
    #log li { padding: 2px 0 2px 18px; position: relative; }
    #log li::before { position: absolute; left: 0; }
    #log .you { color: #e6edf3; font-weight: 600; }
    #log .step::before { content: '›'; color: #8b949e; }
    #log .info { color: #8b949e; }
    #log .ok::before { content: '✓'; color: #3fb950; }
    #log .fail { color: #ffa198; }
    #log .fail::before { content: '✗'; color: #f85149; }
    #log .done { color: #3fb950; font-weight: 600; }
    #log .done::before { content: '★'; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="status">Loading MuJoCo…</div>
  <button id="start">Start camera</button>
  <button id="rec" title="Record this tab as a video (your backup if the live demo fails); press again to stop and save">⏺ Record</button>
  <div id="banner"></div>
  <div id="agent">
    <div class="head"><b>LoadProof</b> <span class="dim">· <span id="ordername"></span> · half-EUR pallet, 1:5 model</span>
      <button id="edit" class="link">change order</button></div>
    <ul id="order"></ul>
    <div id="editor">
      <div id="draft"></div>
      <div id="catalog"></div>
      <div class="row" style="margin: 6px 0 8px">
        <button id="random">🎲 Random order</button>
        <button id="demo">Demo order</button>
        <button id="load">Load this order</button>
      </div>
    </div>
    <div class="row">
      <button id="worker" title="Stack the boxes the way a rushed worker would: in the order they arrived, in columns">👷 Rushed worker</button>
      <button id="takeover" title="Steer the robot with your own hand through the webcam: the manual backup when a person must take over">✋ Take over</button>
      <button id="build" title="The agent reads the order, plans with the search, tests in physics (EU 0.5 g, hard braking 0.8 g), decides on wrap and straps, and has the robot build it">🤖 LoadProof: plan &amp; build</button>
    </div>
    <div class="row" style="margin-top: 6px">
      <input id="ask" placeholder="Paste an order or say what matters, e.g. &quot;Spar: 2 water, 2 cans, rice, cereal, 2 chips (they crush) — motorway trip&quot;" autocomplete="off">
      <label class="dim toggle"><input type="checkbox" id="userobot" checked> 🦾 robot builds it</label>
      <button id="stop">Stop</button>
    </div>
    <div class="row" style="margin-top: 6px">
      <button id="compare" title="Rushed stack on the right pallet, LoadProof plan on the left, same boxes, placed at once">⚖️ Compare</button>
      <button id="knock" title="Shove one box of the finished LoadProof pallet; the robot measures every box and repairs it">💥 Knock a box</button>
      <button id="wrap" title="Wrap what stands on the pallets in stretch film (press again to unwrap)">🎞 Wrap</button>
      <button id="report" title="A printable load stability report for the last LoadProof plan">📄 Report</button>
    </div>
    <div class="row slider" title="0.5 g: the EU load test EUMOS 40509. 0.8 g: the braking value of EN 12195-1, for which loads need straps or the front wall">
      <button id="truck" title="Push the load like a truck swerving, then braking">🚚 Truck test (0.5 g)</button>
      <input type="range" id="g" min="0.3" max="0.8" step="0.1" value="0.5"><span id="gnote" class="dim">0.5 g · EU load test</span>
    </div>
    <details id="memory"><summary id="memstats">🧠 Memory</summary>
      <ul id="lessons"></ul>
      <button id="forget" class="link">forget everything</button>
    </details>
    <ul id="log"></ul>
  </div>
  <div id="camwrap">
    <video id="cam" playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
